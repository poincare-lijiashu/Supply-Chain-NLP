# 物流寄件文本智能分类服务 —— 与本机其他项目容器组（material / edu_agent）完全隔离
#
# 单实例调试：  docker compose up -d && docker compose port api 8004   （查看随机映射）
# 生产入口：    docker compose --profile lb up -d    → http://localhost:18000（Nginx 轮询）
# 水平扩容：    docker compose --profile lb up -d --scale api=4
services:
  api:
    image: supply-chain-nlp:1.2.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MODEL_NAME: distill     # distill | bert_int8 | bert
      DATA_VERSION: v2
      API_AUTH_KEY: ${API_AUTH_KEY:-}   # 设置后 /predict 需带 X-API-Key 请求头（.env 提供）
    volumes:
      - ./data/feedback:/app/data/feedback:rw   # 复检终判回流持久化（容器重建不丢）
    restart: unless-stopped
    expose:
      - "8004"                # 仅容器网络内可见（无固定宿主端口，扩容不冲突）
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    # 无状态：模型权重打包在镜像内，无外部数据卷依赖 —— 可任意扩容/迁移

  loadbalancer:
    image: nginx:alpine
    profiles: ["lb"]          # 生产入口：--profile lb 启用
    ports:
      - "18000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
