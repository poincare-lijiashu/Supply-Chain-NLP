# 供给 compose 内多副本 api 的轮询负载均衡（docker DNS 动态解析，支持 --scale 扩容）
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=10s;   # Docker 内嵌 DNS

  server {
    listen 80;
    server_tokens off;

    # 安全响应头（API + 前端工作台均同源自托管：CSP 允许 'self'，禁外联/内联）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    location / {
      set $api_upstream http://api:8004;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;

      # 客户端真实 IP 透传（应用层限流按此键统计）
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
