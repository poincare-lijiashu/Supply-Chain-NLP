<style>
  :root{
    --surface:#ffffff; --surface-muted:#f4f3f8; --border:#e4e2ec;
    --text-primary:#1f2330; --text-muted:#6b6f7e;
    --brand:#6e56cf; --brand-soft:#6e56cf26; --accent:#d97757; --accent-soft:#d9775726;
    --radius:8px; --radius-card:12px; --radius-full:999px;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  :root[data-widget-theme="dark"]{
    --surface:#1a1c26; --surface-muted:#232634; --border:#33364a;
    --text-primary:#ececf4; --text-muted:#9ba0b5;
    --brand:#8b7cf6; --brand-soft:#8b7cf633; --accent:#e08b6d; --accent-soft:#e08b6d2e;
  }
  .scn{display:block;width:100%;height:auto;font-family:var(--font-sans);}
  .scn text{fill:var(--text-primary);}
  .scn .mut{fill:var(--text-muted);}
  .scn .pan{fill:var(--surface);stroke:var(--border);}
  .scn .box{fill:var(--surface-muted);stroke:var(--border);}
  .scn .edge{stroke:var(--text-muted);stroke-width:1.5;fill:none;}
  .scn .edge-b{stroke:var(--brand);stroke-width:2;fill:none;}
  .scn .tag{fill:var(--brand-soft);}
  .scn .tag-accent{fill:var(--accent-soft);}
  .scn .foc{stroke:var(--brand);stroke-width:2;}
</style>
<svg class="scn" viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Supply Chain NLP v1.2 架构图">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--brand)"/>
    </marker>
  </defs>

  <!-- ===== 数据层 ===== -->
  <rect class="box" x="240" y="20" width="200" height="60" rx="12"/>
  <text x="340" y="46" text-anchor="middle" font-size="14" font-weight="600">托寄物文本合成器</text>
  <text class="mut" x="340" y="66" text-anchor="middle" font-size="12">18w / 1w / 1w · 难度基准</text>
  <path class="edge-b" d="M340 80 V103" marker-end="url(#arrb)"/>
  <rect class="tag" x="352" y="96" width="88" height="20" rx="10"/>
  <text x="396" y="110" text-anchor="middle" font-size="11" fill="var(--brand)">难度基准</text>

  <!-- ===== 训练管线面板 ===== -->
  <rect class="pan" x="40" y="115" width="640" height="140" rx="12"/>
  <text x="62" y="139" font-size="14" font-weight="600">训练管线 · 逐级对照留痕</text>
  <text class="mut" x="618" y="139" text-anchor="end" font-size="12">seed=2026 可复现</text>

  <rect class="box" x="70" y="160" width="84" height="64" rx="8"/>
  <text x="112" y="184" text-anchor="middle" font-size="14" font-weight="600">RF 基线</text>
  <text class="mut" x="112" y="204" text-anchor="middle" font-size="12">87.52</text>

  <path class="edge" d="M154 192 H204" marker-end="url(#arr)"/>
  <rect class="box" x="214" y="160" width="84" height="64" rx="8"/>
  <text x="256" y="184" text-anchor="middle" font-size="14" font-weight="600">fastText</text>
  <text class="mut" x="256" y="204" text-anchor="middle" font-size="12">89.7 → 96.4</text>

  <path class="edge" d="M298 192 H348" marker-end="url(#arr)"/>
  <rect class="box" x="358" y="160" width="84" height="64" rx="8"/>
  <text x="400" y="184" text-anchor="middle" font-size="14" font-weight="600">BERT 微调</text>
  <text class="mut" x="400" y="204" text-anchor="middle" font-size="12">96.37 · F1 .965</text>

  <path class="edge" d="M442 192 H492" marker-end="url(#arr)"/>
  <rect class="box foc" x="502" y="154" width="120" height="76" rx="8"/>
  <rect class="tag" x="596" y="146" width="36" height="18" rx="9"/>
  <text x="614" y="159" text-anchor="middle" font-size="11" fill="var(--brand)">上线</text>
  <text x="562" y="180" text-anchor="middle" font-size="14" font-weight="600">蒸馏 BiLSTM</text>
  <text class="mut" x="562" y="200" text-anchor="middle" font-size="12">96.46 · 反超教师</text>
  <text x="562" y="220" text-anchor="middle" font-size="12" fill="var(--brand)">20.9MB · 16× 提速</text>

  <!-- 训练 → 服务 -->
  <path class="edge-b" d="M360 255 V278" marker-end="url(#arrb)"/>
  <rect class="tag" x="288" y="268" width="132" height="20" rx="10"/>
  <text x="354" y="282" text-anchor="middle" font-size="11" fill="var(--brand)">模型产物即接口</text>

  <!-- ===== 推理服务面板 ===== -->
  <rect class="pan" x="40" y="290" width="640" height="185" rx="12"/>
  <text x="62" y="314" font-size="14" font-weight="600">推理服务 · 安全纵深 + 红线流程</text>
  <rect class="tag" x="470" y="302" width="188" height="20" rx="10"/>
  <text x="564" y="316" text-anchor="middle" font-size="11" fill="var(--brand)">LLM few-shot ▸ 仅选型论证</text>

  <rect class="box foc" x="220" y="330" width="280" height="120" rx="12"/>
  <text x="360" y="358" text-anchor="middle" font-size="15" font-weight="600">FastAPI /predict</text>
  <text class="mut" x="360" y="380" text-anchor="middle" font-size="12">API_AUTH_KEY · 滑动窗口限流</text>
  <text class="mut" x="360" y="398" text-anchor="middle" font-size="12">入参 ≤100条 / ≤512字 · weights_only</text>
  <rect class="tag" x="286" y="410" width="148" height="20" rx="10"/>
  <text x="360" y="424" text-anchor="middle" font-size="11" fill="var(--brand)">模型单例 · 无状态可扩</text>

  <path class="edge" d="M220 370 H192" marker-end="url(#arr)"/>
  <rect class="box" x="58" y="348" width="124" height="60" rx="8"/>
  <text x="120" y="373" text-anchor="middle" font-size="14" font-weight="600">前端工作台</text>
  <text class="mut" x="120" y="392" text-anchor="middle" font-size="12">置信度可视化</text>

  <path class="edge" d="M500 382 H530" marker-end="url(#arr)"/>
  <rect class="box" x="538" y="348" width="124" height="60" rx="8"/>
  <text x="600" y="373" text-anchor="middle" font-size="14" font-weight="600">人工复核队列</text>
  <text class="mut" x="600" y="392" text-anchor="middle" font-size="12">低置信 / 违禁品</text>

  <rect class="tag-accent" x="556" y="332" width="60" height="18" rx="9"/>
  <text x="586" y="344" text-anchor="middle" font-size="11" fill="var(--accent)">红线兜底</text>
  <text class="mut" x="360" y="470" text-anchor="middle" font-size="12">prob &lt; 0.60 或命中违禁品 ▸ 强制人工复核</text>
</svg>
