name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU deps
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # fasttext 0.9.x 与 numpy 2.x 兼容补丁（与 Dockerfile 保持一致）
          python -c "import fasttext, pathlib; p = pathlib.Path(fasttext.__file__).parent / 'FastText.py'; s = p.read_text(encoding='utf-8'); p.write_text(s.replace('np.array(probs, copy=False)', 'np.asarray(probs)'), encoding='utf-8')"
      - name: Generate smoke data
        run: python data/generate_data.py --train 4000 --dev 500 --test 500 --outdir data/raw
      - name: Unit tests
        run: python -m pytest tests/test_smoke.py -q
      - name: Full pipeline smoke
        run: python scripts/run_smoke.py
