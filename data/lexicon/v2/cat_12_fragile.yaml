# =====================================================================
# 类目 12 · 易碎品本体（v2-draft1）——属性通道类，与内容物类目正交
# 对齐：顺丰"玻璃／瓷／玉石製品／工藝品／貴重物品"、菜鸟协议"易碎物品类"
# 判定（规则R2/R3，详见裁决手册）：
#   玻璃/陶瓷/玉石/水晶材质制品，或显式易碎申报（轻拿轻放+易碎材质）→12
#   显式声明"不是易碎/普通袋装"→回内容物类目（否定翻转）
#   玻璃面积>30%的家具→12（纯材质属性，不管用途）
# 本库只收"以易碎材质为主体"的制品；内容物（玻璃瓶装奶粉/香水等）由
#   生成器跨属性规则组合产生，避免与3/5/6/11词库硬冲突
# =====================================================================
