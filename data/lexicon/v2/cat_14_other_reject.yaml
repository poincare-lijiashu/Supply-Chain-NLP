# =====================================================================
# 类目 14 · 其他/拒识本体（v2-draft1）
# 三个分支（规则R17）：
#   A 零信息描述：有寄件动作但无任何品类信息 → 转人工要求补全
#   B 体系外杂物：确属托寄物但0-13无法安放 → 转人工
#   C 异常/非托寄输入：乱码/外文/脏话/无关文本/恶作剧 → 转人工/拒绝
# 与各类的区别：本类只做严格兜底，少见但可归类的词（轴承/胶带）严禁塞这里
# 本文件中 reject_patterns 供生成器按模式扩充，不作为普通物品词参与模板组合
# =====================================================================
