# =====================================================================
# 类目 8 · 违禁/限寄品本体（v2-draft1）
# 依据：国家邮政局 公安部 国家安全部《禁止寄递物品管理规定》
#       （国邮发〔2016〕107号，2016-12-16）附录《禁止寄递物品指导目录》
#       官方名录：https://zwfw.spb.gov.cn/gjj/jxjwpml
# 字段约定：
#   attrs.banned=true      明令禁寄（红线，模型应判违禁并强制人工/拒收）
#   attrs.restricted=true  限寄（满足容量/包装/数量条件可寄，初审一律转人工核验）
#   syn: 口语别名/输单常见写法（同一概念的不同说法）
#   普通词直接写字符串；带别名或特殊属性的词用对象
# =====================================================================
