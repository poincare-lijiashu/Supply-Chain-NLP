# =====================================================================
# 类目 6 · 医药保健本体（v2-draft1）
# 对齐：中通快运"药品+医疗设备"
# 范围：非处方常用药/中药材（合规）/保健品/医疗器械/奶粉/孕婴营养/医用防护
# 边界：毒品/非法麻醉精神药品/易制毒→13；普通食品形态（红枣枸杞零食装）→3；
#       电动按摩椅→2；宠物药→4宠物用品；胰岛素等冷藏药附冷链提示+人工
# =====================================================================
