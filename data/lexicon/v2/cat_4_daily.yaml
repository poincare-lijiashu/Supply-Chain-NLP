#           宠物用品/母婴日用/个护家清/园艺节庆"组织
# 关键修复（v1 病根）：
#   胶带/剪刀/普通电池/文具在 v1 是"无标签背景词"，v2 明确归本类
# 归类口径（详见裁决手册）：
#   陶瓷/玻璃材质餐具容器→7 易碎品；金属/塑料/木质餐具→本类
#   电动小电器（吹风机/电动牙刷）→2 数码家电；手动工具→本类
#   普通5号/7号干电池→本类；锂电池/充电宝/铅酸电瓶→8
# =====================================================================
