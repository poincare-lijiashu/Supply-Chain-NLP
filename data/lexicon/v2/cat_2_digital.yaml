# =====================================================================
# 类目 2 · 数码家电本体（v2-draft1）
# 对齐：中通快运"电气/电子/安防+家用电器"、顺丰"电子产品/大小家电/办公设备/电脑类"
# 关键边界：
#   整机含内置不可拆卸锂电池 attrs.battery_embedded（陆运正常/空运受限，只提示不拦）
#   充电宝/独立锂电池/散装电池/铅酸电瓶 → 13；普通5号7号干电池 → 4
#   装了合同的U盘 → 0（R9）；纯空U盘/硬盘 → 2
#   美容仪/筋膜枪/电动牙刷等带电个人护理小电器 → 2（非带电版本→4/5）
# =====================================================================
